<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road to 100 Hours Stick Time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .backup-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .backup-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.3s;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .backup-btn:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .year-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .year-selector button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        .year-selector button:hover {
            background: #5568d3;
        }

        .year-selector span {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            min-width: 80px;
            text-align: center;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .unit {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 2px solid #ddd;
        }

        .legend-box.flight { background: #4ade80; }
        .legend-box.sim { background: #60a5fa; }
        .legend-box.both { background: linear-gradient(135deg, #4ade80 50%, #60a5fa 50%); }
        .legend-box.bonus { background: #fbbf24; border: 2px solid #f59e0b; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .month {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .month-name {
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            color: #667eea;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-label {
            text-align: center;
            font-size: 0.7em;
            font-weight: bold;
            color: #666;
            padding: 4px 0;
        }

        .day {
            aspect-ratio: 1;
            border: 2px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            transition: all 0.2s;
            background: white;
            position: relative;
        }

        .day:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .day.empty {
            background: white;
            color: #666;
        }

        .day.flight {
            background: #4ade80;
            color: white;
            border-color: #22c55e;
        }

        .day.sim {
            background: #60a5fa;
            color: white;
            border-color: #3b82f6;
        }

        .day.both {
            background: linear-gradient(135deg, #4ade80 50%, #60a5fa 50%);
            color: white;
            border-color: #667eea;
        }

        .day.bonus {
            background: #fbbf24;
            color: white;
            border: 3px solid #f59e0b;
            font-weight: bold;
        }

        .day.disabled {
            background: #f0f0f0;
            color: #ccc;
            cursor: default;
            pointer-events: none;
        }

        .bonus-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 6px;
            height: 6px;
            background: #fbbf24;
            border-radius: 50%;
            border: 1px solid #f59e0b;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal-content label {
            display: block;
            margin: 15px 0 5px;
            font-weight: 600;
            color: #333;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .context-menu {
            display: none;
            position: fixed;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1001;
        }

        .context-menu.active {
            display: block;
        }

        .context-menu-item {
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .context-menu-item:hover {
            background: #f3f4f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Road to 100 Hours Stick Time</h1>
            <p>Countdown to Becoming a Good Pilot</p>
            <div class="backup-buttons">
                <button class="backup-btn" onclick="exportData()">📥 Export Data</button>
                <button class="backup-btn" onclick="document.getElementById('importFile').click()">📤 Import Data</button>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
            </div>
        </header>

        <div class="year-selector">
            <button onclick="changeYear(-1)">← Previous</button>
            <span id="currentYear">2026</span>
            <button onclick="changeYear(1)">Next →</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Flight Time</h3>
                <div class="value" id="totalFlightTime">0</div>
                <div class="unit">minutes</div>
            </div>
            <div class="stat-card">
                <h3>Total SIM Time</h3>
                <div class="value" id="totalSimTime">0</div>
                <div class="unit">minutes</div>
            </div>
            <div class="stat-card">
                <h3>Days Until "Good"</h3>
                <div class="value" id="daysRemaining">600</div>
                <div class="unit">days remaining</div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-box flight"></div>
                <span>Flight Time (10 min)</span>
            </div>
            <div class="legend-item">
                <div class="legend-box sim"></div>
                <span>SIM Time (30 min)</span>
            </div>
            <div class="legend-item">
                <div class="legend-box both"></div>
                <span>Both</span>
            </div>
            <div class="legend-item">
                <div class="legend-box bonus"></div>
                <span>Bonus Hours</span>
            </div>
        </div>

        <div id="calendar" class="calendar-grid"></div>
    </div>

    <div id="bonusModal" class="modal">
        <div class="modal-content">
            <h2>Add Bonus Time</h2>
            <p id="modalDate"></p>
            <label>Additional Flight Time (minutes):</label>
            <input type="number" id="bonusFlightInput" min="0" value="0">
            <label>Additional SIM Time (minutes):</label>
            <input type="number" id="bonusSimInput" min="0" value="0">
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeBonusModal()">Cancel</button>
                <button class="btn-primary" onclick="saveBonusTime()">Save</button>
            </div>
        </div>
    </div>

    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" onclick="addBonusFromContext()">Add Bonus Time</div>
    </div>

    <script>
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 
                           'July', 'August', 'September', 'October', 'November', 'December'];
        const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        
        let currentYear = 2026;
        let data = {};
        let selectedDay = null;

        // Initialize or load data
        function initData() {
            const saved = localStorage.getItem('flightTrackerData');
            if (saved) {
                data = JSON.parse(saved);
            }
        }

        function saveData() {
            localStorage.setItem('flightTrackerData', JSON.stringify(data));
        }

        function getDayKey(year, month, day) {
            return `${year}-${month}-${day}`;
        }

        function getDayData(year, month, day) {
            const key = getDayKey(year, month, day);
            return data[key] || { type: 'empty', bonusFlight: 0, bonusSim: 0 };
        }

        function setDayData(year, month, day, dayData) {
            const key = getDayKey(year, month, day);
            data[key] = dayData;
            saveData();
        }

        function changeYear(delta) {
            currentYear += delta;
            document.getElementById('currentYear').textContent = currentYear;
            renderCalendar();
        }

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            for (let month = 0; month < 12; month++) {
                const monthDiv = document.createElement('div');
                monthDiv.className = 'month';

                const monthTitle = document.createElement('div');
                monthTitle.className = 'month-name';
                monthTitle.textContent = monthNames[month];
                monthDiv.appendChild(monthTitle);

                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';

                // Add day labels
                dayLabels.forEach(label => {
                    const dayLabel = document.createElement('div');
                    dayLabel.className = 'day-label';
                    dayLabel.textContent = label;
                    daysGrid.appendChild(dayLabel);
                });

                const firstDay = new Date(currentYear, month, 1).getDay();
                const daysInMonth = new Date(currentYear, month + 1, 0).getDate();

                // Add empty cells for days before month starts
                for (let i = 0; i < firstDay; i++) {
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'day disabled';
                    daysGrid.appendChild(emptyDay);
                }

                // Add actual days
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'day';
                    dayDiv.textContent = day;
                    
                    const dayData = getDayData(currentYear, month, day);
                    
                    if (dayData.bonusFlight > 0 || dayData.bonusSim > 0) {
                        dayDiv.classList.add('bonus');
                    } else {
                        dayDiv.classList.add(dayData.type);
                    }

                    dayDiv.addEventListener('click', (e) => {
                        toggleDay(currentYear, month, day);
                    });

                    dayDiv.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        showContextMenu(e, currentYear, month, day);
                    });

                    daysGrid.appendChild(dayDiv);
                }

                monthDiv.appendChild(daysGrid);
                calendar.appendChild(monthDiv);
            }

            updateStats();
        }

        function toggleDay(year, month, day) {
            const dayData = getDayData(year, month, day);
            
            // Cycle through: empty -> flight -> sim -> both -> empty
            const cycle = ['empty', 'flight', 'sim', 'both'];
            const currentIndex = cycle.indexOf(dayData.type);
            const nextIndex = (currentIndex + 1) % cycle.length;
            
            dayData.type = cycle[nextIndex];
            setDayData(year, month, day, dayData);
            renderCalendar();
        }

        function showContextMenu(event, year, month, day) {
            event.preventDefault();
            event.stopPropagation();
            
            // Close any existing menu first
            closeContextMenu();
            
            selectedDay = { year, month, day };
            
            const menu = document.getElementById('contextMenu');
            menu.style.left = event.pageX + 'px';
            menu.style.top = event.pageY + 'px';
            menu.classList.add('active');

            // Close menu when clicking elsewhere
            setTimeout(() => {
                document.addEventListener('click', closeContextMenu, { once: true });
            }, 100);
        }

        function closeContextMenu() {
            const menu = document.getElementById('contextMenu');
            menu.classList.remove('active');
        }

        function addBonusFromContext() {
            if (!selectedDay) return;
            
            closeContextMenu();
            
            const { year, month, day } = selectedDay;
            const dayData = getDayData(year, month, day);
            
            document.getElementById('modalDate').textContent = 
                `${monthNames[month]} ${day}, ${year}`;
            document.getElementById('bonusFlightInput').value = dayData.bonusFlight || 0;
            document.getElementById('bonusSimInput').value = dayData.bonusSim || 0;
            document.getElementById('bonusModal').classList.add('active');
        }

        function closeBonusModal() {
            document.getElementById('bonusModal').classList.remove('active');
            selectedDay = null;
        }

        function saveBonusTime() {
            if (!selectedDay) return;
            
            const { year, month, day } = selectedDay;
            const dayData = getDayData(year, month, day);
            
            dayData.bonusFlight = parseInt(document.getElementById('bonusFlightInput').value) || 0;
            dayData.bonusSim = parseInt(document.getElementById('bonusSimInput').value) || 0;
            
            setDayData(year, month, day, dayData);
            closeBonusModal();
            renderCalendar();
        }

        function formatTime(minutes) {
            if (minutes < 60) {
                return minutes;
            }
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return mins > 0 ? `${hours}h ${mins}m` : `${hours}h`;
        }

        function formatTimeUnit(minutes) {
            return minutes < 60 ? 'minutes' : '';
        }

        function updateStats() {
            let totalFlight = 0;
            let totalSim = 0;
            let flightDays = 0;

            for (const key in data) {
                const dayData = data[key];
                
                // Add daily amounts
                if (dayData.type === 'flight' || dayData.type === 'both') {
                    totalFlight += 10;
                    flightDays += 1;
                }
                if (dayData.type === 'sim' || dayData.type === 'both') {
                    totalSim += 30;
                }

                // Add bonus amounts
                totalFlight += dayData.bonusFlight || 0;
                totalSim += dayData.bonusSim || 0;
            }

            document.getElementById('totalFlightTime').textContent = formatTime(totalFlight);
            document.getElementById('totalSimTime').textContent = formatTime(totalSim);
            document.getElementById('daysRemaining').textContent = Math.max(0, 600 - flightDays);
            
            // Update units
            document.querySelector('#totalFlightTime').nextElementSibling.textContent = formatTimeUnit(totalFlight);
            document.querySelector('#totalSimTime').nextElementSibling.textContent = formatTimeUnit(totalSim);
        }

        // Close modal when clicking outside
        document.getElementById('bonusModal').addEventListener('click', (e) => {
            if (e.target.id === 'bonusModal') {
                closeBonusModal();
            }
        });

        function exportData() {
            const exportData = {
                version: '1.0',
                exportDate: new Date().toISOString(),
                data: data
            };

            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `flight-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            alert('Data exported successfully! 🎉\n\nYour backup file has been downloaded.');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // Validate the data structure
                    if (!importedData.data || typeof importedData.data !== 'object') {
                        throw new Error('Invalid data format');
                    }

                    // Confirm before overwriting
                    const confirmed = confirm(
                        `Import data from ${new Date(importedData.exportDate).toLocaleDateString()}?\n\n` +
                        'This will replace your current progress. Make sure you\'ve exported your current data first if needed!'
                    );

                    if (confirmed) {
                        data = importedData.data;
                        saveData();
                        renderCalendar();
                        alert('Data imported successfully! 🎉\n\nYour progress has been restored.');
                    }
                } catch (error) {
                    alert('Error importing data! ❌\n\nPlease make sure you\'re using a valid backup file.');
                    console.error('Import error:', error);
                }
            };
            reader.readAsText(file);
            
            // Reset the file input so the same file can be imported again if needed
            event.target.value = '';
        }

        // Initialize
        initData();
        renderCalendar();
    </script>
</body>
</html>
